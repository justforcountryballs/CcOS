# ccos USB stick: two copies of ccos ("slots") so an update can't break the stick.
#   slot a = /boot/ccos   slot b = /boot/ccos-b   (grubenv says which one)
# After an update, trying=1: this start tries the new slot (trying=2). ccos
# sets trying back to nothing once it reaches the desktop. If the new version
# never gets there, the next start still sees trying=2 and goes back to prev.
set timeout=3
set default=0
insmod all_video
insmod gfxterm
set gfxpayload=keep
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
set slot=a
set prev=
set trying=
if [ -f $prefix/grubenv ]; then
    load_env slot prev trying
fi
if [ "$trying" = "1" ]; then
    set trying=2
    save_env trying
elif [ "$trying" = "2" ]; then
    set slot="$prev"
    set prev=
    set trying=
    set rolledback=1
    save_env slot prev trying rolledback
fi
if [ "$slot" = "b" ]; then set dir=/boot/ccos-b; else set slot=a; set dir=/boot/ccos; fi
if [ "$prev" = "b" ]; then set pdir=/boot/ccos-b; elif [ "$prev" = "a" ]; then set pdir=/boot/ccos; else set pdir=; fi
export dir pdir slot prev
menuentry "ccos" {
    linux $dir/bzImage ccos.live panic=10 ccos.slot=$slot i915.enable_psr=0 i915.enable_fbc=0 quiet loglevel=3 logo.nologo
    initrd $dir/initramfs.cpio.gz
}
if [ -n "$pdir" ]; then
    menuentry "ccos (previous version)" {
        linux $pdir/bzImage ccos.live panic=10 ccos.slot=$prev i915.enable_psr=0 i915.enable_fbc=0 quiet loglevel=3 logo.nologo
        initrd $pdir/initramfs.cpio.gz
    }
fi
menuentry "ccos (safe graphics: if the screen stays black)" {
    linux $dir/bzImage ccos.live panic=10 ccos.slot=$slot nomodeset quiet loglevel=3 logo.nologo
    initrd $dir/initramfs.cpio.gz
}
menuentry "ccos (show boot messages)" {
    linux $dir/bzImage ccos.live panic=10 ccos.slot=$slot i915.enable_psr=0 i915.enable_fbc=0 loglevel=7 ccos.verbose
    initrd $dir/initramfs.cpio.gz
}
menuentry "Restart" { reboot }
menuentry "Turn off" { halt }
